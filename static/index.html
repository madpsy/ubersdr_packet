<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UberSDR Packet</title>
  <link rel="stylesheet" href="style.css">
  <script>window.BASE_PATH = "{{.BasePath}}";</script>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>UberSDR Packet</h1>
      <div class="header-actions">
        <button id="login-btn" class="btn btn-secondary btn-sm hidden" onclick="showLoginModal()">Login</button>
        <span id="auth-authed" class="auth-authed hidden">Authenticated</span>
        <button id="logout-btn" class="btn btn-secondary btn-sm hidden" onclick="doLogout()">Logout</button>
        <button id="btn-add-channel" class="btn btn-primary hidden">+ Add Channel</button>
        <span id="conn-status" class="conn-status conn-disconnected" title="SSE connection">●</span>
      </div>
    </div>
  </header>

  <!-- Add-channel panel -->
  <div id="add-channel-panel" class="add-panel hidden">
    <div class="add-panel-inner">
      <h2>Add Channel</h2>

      <!-- Frequency preset selector -->
      <div class="freq-preset-row">
        <label>Frequency preset
          <select id="add-freq-preset">
            <option value="">— Select a preset —</option>
            <optgroup label="HF Packet">
              <option value="7049450,usb">7.049.45 MHz USB (UK Packet)</option>
            </optgroup>
          </select>
        </label>
      </div>

      <div class="form-grid">
        <label>Frequency (Hz)
          <input type="number" id="add-freq" placeholder="7049450" min="1">
        </label>
        <label>Mode
          <select id="add-mode">
            <option value="usb">USB</option>
            <option value="lsb">LSB</option>
          </select>
        </label>
        <label>Name (optional)
          <input type="text" id="add-name" placeholder="20m Packet">
        </label>
        <label>Bandwidth Hz (0=default)
          <input type="number" id="add-bw" value="0" min="0">
        </label>
        <label id="add-mqtt-prefix-row" class="hidden">📡 MQTT Topic
          <div class="mqtt-topic-field">
            <span id="add-mqtt-prefix-badge" class="mqtt-topic-prefix-badge">packet/</span>
            <input type="text" id="add-mqtt-suffix" placeholder="channel-name">
          </div>
        </label>
      </div>

      <h3>Modem Channels</h3>
      <div id="add-modem-channels" class="modem-channels-grid">
        <!-- rendered by JS -->
      </div>

      <div class="add-panel-actions">
        <button id="btn-add-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-add-submit" class="btn btn-primary">Add</button>
      </div>
    </div>
  </div>

  <main id="channels-container">
    <div id="no-channels" class="empty-state">
      No channels configured.
    </div>
  </main>

  <!-- Login modal -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Login</h2>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password">
      </label>
      <div id="login-error" class="modal-error hidden">Incorrect password.</div>
      <div class="modal-actions">
        <button id="login-cancel" class="btn btn-secondary">Cancel</button>
        <button id="login-submit" class="btn btn-primary">Login</button>
      </div>
    </div>
  </div>

  <script src="ax25decode.js"></script>
  <script src="app.js"></script>
</body>
</html>
