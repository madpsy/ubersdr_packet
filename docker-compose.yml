services:
  ubersdr-packet:
    image: madpsy/ubersdr-packet:latest
    container_name: packet
    restart: unless-stopped
    init: true
    shm_size: '256m'
    cpu_shares: 512
    environment:
      # Required: UberSDR WebSocket URL
      UBERSDR_URL: "ws://ubersdr:8080/ws"
      #
      # Channels are managed via the web UI and persisted to /data/channels.json.
      #
      # Uncomment and set as needed:
      # UBERSDR_PASS: ""
      # UI_PASSWORD: ""          # Set to enable password-protected write actions in the web UI
      # WEB_PORT: "6089"
      # REPLAY_BUF_SIZE: "200"   # Recent AX.25 frames replayed to late-joining browsers (0 to disable)
      #
      # MQTT — optional; set MQTT_ENABLED=true and configure the broker to
      # publish raw KISS frames per channel to <topic_prefix>/<channel_label>.
      # Use ssl:// broker URL for TLS; set MQTT_TLS_SKIP_VERIFY=true to skip
      # certificate verification (e.g. self-signed certs).
      # MQTT_ENABLED: "false"
      # MQTT_BROKER: "tcp://mqtt.example.com:1883"   # plain TCP
      # MQTT_BROKER: "ssl://mqtt.example.com:8883"   # TLS
      # MQTT_USER: ""
      # MQTT_PASS: ""
      # MQTT_TLS_SKIP_VERIFY: "false"   # set "true" to skip TLS cert verification
      # MQTT_TOPIC_PREFIX: "packet"     # frames publish to <prefix>/<channel_label>
      #                                 # per-channel overrides take precedence
    networks:
      - sdr-network
    volumes:
      - ./data:/data
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "ubersdr-packet"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
